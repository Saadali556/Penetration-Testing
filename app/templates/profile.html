{% extends "base.html" %}

{% block content %}

<h1>My Profile</h1>

<div class="product-card">

    <p>
        <strong>Name:</strong>
        {{ user.name }}

    <p>

    <p>
        <strong>Role:</strong>
        {{ user.role }}
    </p>

</div>

{% endblock %}
