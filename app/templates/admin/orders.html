{% extends "base.html" %}

{% block title %}All Orders{% endblock %}

{% block content %}

<h1>All Orders</h1>

<table>

    <tr>
        <th>Order</th>
        <th>User</th>
        <th>Total</th>
        <th>Status</th>
    </tr>

    {% for order in orders %}

    <tr>
        <td>#{{ order.id }}</td>
        <td>{{ order.user.email }}</td>
        <td>${{ "%.2f"|format(order.total) }}</td>
        <td>{{ order.status }}</td>
    </tr>

    {% endfor %}

</table>

{% endblock %}
