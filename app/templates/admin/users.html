{% extends "base.html" %}

{% block title %}Manage Users{% endblock %}

{% block content %}

<h1>Users</h1>

<table>

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
    </tr>

    {% for user in users %}

    <tr>
        <td>{{ user.id }}</td>
        <td>{{ user.name }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
    </tr>

    {% endfor %}

</table>

{% endblock %}
