{% extends "base.html" %}

{% block title %}Add Product{% endblock %}

{% block content %}

<h1>Add Product</h1>

<div class="form-container">

<form method="POST">

    <label>Name</label>

    <input
        type="text"
        name="name"
        required
    >

    <label>Description</label>

    <input
        type="text"
        name="description"
        required
    >

    <label>Price</label>

    <input
        type="number"
        name="price"
        step="0.01"
        min="0"
        required
    >

    <label>Stock</label>

    <input
        type="number"
        name="stock"
        min="0"
        required
    >

    <button type="submit">
        Create Product
    </button>

</form>

</div>

{% endblock %}
