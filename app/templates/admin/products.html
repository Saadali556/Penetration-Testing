{% extends "base.html" %}

{% block title %}Manage Products{% endblock %}

{% block content %}

<h1>Products</h1>

<p>
    <a href="/admin/products/add">
        Add Product
    </a>
</p>

<table>

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Price</th>
        <th>Stock</th>
    </tr>

    {% for product in products %}

    <tr>
        <td>{{ product.id }}</td>
        <td>{{ product.name }}</td>
        <td>${{ "%.2f"|format(product.price) }}</td>
        <td>{{ product.stock }}</td>
    </tr>

    {% endfor %}

</table>

{% endblock %}
